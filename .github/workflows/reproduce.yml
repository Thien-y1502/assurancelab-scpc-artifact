name: reproduce-scpc

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile SCPC/run_scpc_v2.py
      - run: python SCPC/run_scpc_v2.py
      - run: python -c "import json; assert json.load(open('SCPC/results.json'))['status'] == 'PASS'"
